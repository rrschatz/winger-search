<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Women in Ministry — Idea Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #0f1923;
      --navy-mid:   #1a2838;
      --navy-light: #243447;
      --cream:      #f5f0e8;
      --cream-dim:  #e8e2d6;
      --gold:       #c9a84c;
      --gold-light: #e8c96e;
      --white:      #ffffff;

      --tag-scripture:    #2563eb;
      --tag-greek:        #7c3aed;
      --tag-hebrew:       #0d9488;
      --tag-person:       #ea580c;
      --tag-work:         #92400e;
      --tag-topic:        #16a34a;
      --tag-concept:      #64748b;

      --radius: 4px;
      --shadow: 0 2px 12px rgba(0,0,0,0.18);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--cream);
      color: var(--navy);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--navy);
      color: var(--cream);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(0,0,0,0.4);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: stretch;
    }

    .header-brand {
      padding: 18px 28px 18px 0;
      border-right: 1px solid var(--navy-light);
      flex-shrink: 0;
    }

    .brand-series {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--cream);
    }

    .brand-sub {
      font-size: 11px;
      color: #6b7f96;
      margin-top: 3px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .header-search {
      flex: 1;
      padding: 14px 0 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-field {
      position: relative;
      flex: 1;
    }

    .search-field label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      position: absolute;
      top: 8px;
      left: 12px;
      pointer-events: none;
      z-index: 1;
    }

    .search-field input {
      width: 100%;
      background: var(--navy-mid);
      border: 1px solid var(--navy-light);
      border-radius: var(--radius);
      color: var(--cream);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      padding: 26px 12px 8px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .search-field input::placeholder { color: #4a5e72; }

    .search-field input:focus {
      border-color: var(--gold);
      background: var(--navy-light);
    }

    .btn-search {
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: var(--radius);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0 20px;
      height: 52px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-search:hover { background: var(--gold-light); }
    .btn-search:active { transform: scale(0.97); }

    /* FILTER BAR */
    .filter-bar {
      background: var(--navy-mid);
      border-top: 1px solid var(--navy-light);
      border-bottom: 1px solid rgba(201,168,76,0.15);
    }

    .filter-bar-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      overflow-x: auto;
    }

    .filter-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #4a5e72;
      white-space: nowrap;
      padding: 10px 16px 10px 0;
      flex-shrink: 0;
    }

    .filter-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #6b7f96;
      padding: 10px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .filter-btn:hover { color: var(--cream); }

    .filter-btn.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    /* MAIN */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* STATUS */
    .status-bar {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--cream-dim);
    }

    .result-count {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 600;
    }

    .result-count span { color: var(--gold); }

    .status-hint {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #8a9aaa;
    }

    /* LOADING */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      gap: 20px;
    }

    .loader-ring {
      width: 48px;
      height: 48px;
      border: 3px solid var(--cream-dim);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #8a9aaa;
    }

    /* ERROR */
    .error-state {
      background: #fff0f0;
      border: 1px solid #fca5a5;
      border-radius: var(--radius);
      padding: 20px 24px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: #991b1b;
    }

    /* EMPTY */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
    }

    .empty-state-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #c0c8d0;
      margin-bottom: 10px;
    }

    .empty-state-sub {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: #a0aab4;
    }

    /* WELCOME */
    .welcome-state {
      text-align: center;
      padding: 60px 24px;
    }

    .welcome-title {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 12px;
    }

    .welcome-desc {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      color: #5a6a7a;
      max-width: 560px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }

    .welcome-stats {
      display: flex;
      gap: 32px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .welcome-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .welcome-stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }

    .welcome-stat-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8a9aaa;
    }

    /* CARDS */
    .results-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--cream-dim);
      border-radius: 6px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 4px 1fr;
      overflow: hidden;
      transition: box-shadow 0.15s, transform 0.15s;
      animation: fadeInUp 0.2s ease both;
    }

    .card:hover {
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      transform: translateY(-1px);
    }

    .card-rail {
      background: var(--navy);
    }

    .card-body {
      padding: 16px 20px 14px;
    }

    .card-meta {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .card-video-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8a9aaa;
      flex-shrink: 0;
    }

    .card-video-title {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--navy);
      flex: 1;
      min-width: 0;
    }

    .card-timestamp {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--gold);
      text-decoration: none;
      flex-shrink: 0;
      padding: 2px 8px;
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 3px;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .card-timestamp::before {
      content: '\25B6';
      font-size: 7px;
    }

    .card-timestamp:hover {
      background: var(--gold);
      color: var(--navy);
      border-color: var(--gold);
    }

    .card-summary {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .card-context {
      font-family: 'IBM Plex Sans', sans-serif;
      font-style: italic;
      font-size: 12px;
      color: #6a7a8a;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    /* TAGS */
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 10px;
    }

    .tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 3px;
      border: 1px solid;
      cursor: default;
      transition: opacity 0.1s;
    }

    .tag:hover { opacity: 0.8; }

    .tag-scripture   { color: #2563eb; border-color: rgba(37,99,235,0.3);   background: rgba(37,99,235,0.07); }
    .tag-greek_term  { color: #7c3aed; border-color: rgba(124,58,237,0.3);  background: rgba(124,58,237,0.07); }
    .tag-hebrew_term { color: #0d9488; border-color: rgba(13,148,136,0.3);  background: rgba(13,148,136,0.07); }
    .tag-person      { color: #ea580c; border-color: rgba(234,88,12,0.3);   background: rgba(234,88,12,0.07); }
    .tag-work        { color: #92400e; border-color: rgba(146,64,14,0.3);   background: rgba(146,64,14,0.07); }
    .tag-topic       { color: #16a34a; border-color: rgba(22,163,74,0.3);   background: rgba(22,163,74,0.07); }
    .tag-concept     { color: #64748b; border-color: rgba(100,116,139,0.3); background: rgba(100,116,139,0.07); }

    /* DETAIL */
    .card-detail-toggle {
      background: none;
      border: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: #8a9aaa;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s;
      margin-top: 2px;
    }

    .card-detail-toggle:hover { color: var(--navy); }

    .toggle-arrow {
      display: inline-block;
      transition: transform 0.2s;
      font-size: 8px;
    }

    .toggle-arrow.open { transform: rotate(90deg); }

    .card-detail-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, margin-top 0.2s;
    }

    .card-detail-body.open {
      max-height: 400px;
      margin-top: 10px;
    }

    .card-detail-text {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      line-height: 1.65;
      color: #3a4a5a;
      border-left: 2px solid var(--cream-dim);
      padding-left: 14px;
    }

    /* SCROLLBAR */
    .filter-bar-inner::-webkit-scrollbar { height: 3px; }
    .filter-bar-inner::-webkit-scrollbar-track { background: transparent; }
    .filter-bar-inner::-webkit-scrollbar-thumb { background: var(--navy-light); border-radius: 2px; }

    /* ANIMATION */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      .header-inner { flex-direction: column; padding: 16px; gap: 0; }
      .header-brand { padding: 0 0 12px; border-right: none; border-bottom: 1px solid var(--navy-light); }
      .header-search { padding: 12px 0 0; }
      .search-row { flex-wrap: wrap; }
      .btn-search { flex: 1; }
      .card-meta { flex-direction: column; gap: 6px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-brand">
      <div class="brand-series">Mike Winger &middot; Video Series</div>
      <div class="brand-title">Women in Ministry</div>
      <div class="brand-sub">13 videos &middot; idea index</div>
    </div>
    <div class="header-search">
      <div class="search-row">
        <div class="search-field" style="flex:2">
          <label>Keyword Search</label>
          <input type="text" id="kwInput" placeholder="headship, authority, submission&hellip;" autocomplete="off" spellcheck="false">
        </div>
        <div class="search-field" style="flex:2">
          <label>Tag / Person / Scripture</label>
          <input type="text" id="tagInput" placeholder="kephale, Philip Payne, 1 Tim 2:12&hellip;" autocomplete="off" spellcheck="false">
        </div>
        <button class="btn-search" id="searchBtn">Search</button>
      </div>
    </div>
  </div>
</header>

<div class="filter-bar">
  <div class="filter-bar-inner">
    <span class="filter-label">Filter by tag type:</span>
    <button class="filter-btn active" data-cat="">All</button>
    <button class="filter-btn" data-cat="topic">Topic</button>
    <button class="filter-btn" data-cat="scripture">Scripture</button>
    <button class="filter-btn" data-cat="person">Person</button>
    <button class="filter-btn" data-cat="greek_term">Greek Term</button>
    <button class="filter-btn" data-cat="hebrew_term">Hebrew Term</button>
    <button class="filter-btn" data-cat="work">Work</button>
    <button class="filter-btn" data-cat="concept">Concept</button>
  </div>
</div>

<main>
  <div id="statusBar" class="status-bar" style="display:none">
    <div class="result-count" id="resultCount"></div>
    <div class="status-hint" id="statusHint"></div>
  </div>
  <div id="appContent">
    <div class="loading-state" id="loadingState">
      <div class="loader-ring"></div>
      <div class="loading-label">Loading database&hellip;</div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script>
(async function () {
  var db = null;
  var activeCategory = '';
  var lastKeyword = '';
  var lastTag = '';
  var dbStats = { ideas: 0, videos: 0, tags: 0 };

  var kwInput    = document.getElementById('kwInput');
  var tagInput   = document.getElementById('tagInput');
  var searchBtn  = document.getElementById('searchBtn');
  var appContent = document.getElementById('appContent');
  var statusBar  = document.getElementById('statusBar');
  var resultCount = document.getElementById('resultCount');
  var statusHint = document.getElementById('statusHint');

  try {
    var SQL = await initSqlJs({
      locateFile: function(file) {
        return 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/' + file;
      }
    });
    var resp = await fetch('mike_winger.db');
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ' — could not fetch mike_winger.db');
    var buf = await resp.arrayBuffer();
    db = new SQL.Database(new Uint8Array(buf));

    dbStats.ideas  = db.exec('SELECT COUNT(*) FROM ideas')[0].values[0][0];
    dbStats.videos = db.exec('SELECT COUNT(*) FROM videos')[0].values[0][0];
    dbStats.tags   = db.exec('SELECT COUNT(DISTINCT name) FROM tags')[0].values[0][0];

    showWelcome();
  } catch(err) {
    showError(err.message);
    return;
  }

  function showWelcome() {
    statusBar.style.display = 'none';
    appContent.innerHTML =
      '<div class="welcome-state">' +
        '<div class="welcome-title">Search Mike Winger\'s Idea Index</div>' +
        '<div class="welcome-desc">Every significant idea, argument, and reference across the full 13-part series &mdash; keyword searchable and tagged by scripture, person, Greek term, and more.</div>' +
        '<div class="welcome-stats">' +
          '<div class="welcome-stat"><div class="welcome-stat-num">' + dbStats.videos + '</div><div class="welcome-stat-label">Videos</div></div>' +
          '<div class="welcome-stat"><div class="welcome-stat-num">' + Number(dbStats.ideas).toLocaleString() + '</div><div class="welcome-stat-label">Ideas indexed</div></div>' +
          '<div class="welcome-stat"><div class="welcome-stat-num">' + Number(dbStats.tags).toLocaleString() + '</div><div class="welcome-stat-label">Unique tags</div></div>' +
        '</div>' +
      '</div>';
  }

  function showError(msg) {
    statusBar.style.display = 'none';
    appContent.innerHTML = '<div class="error-state">Error: ' + escHtml(msg) + '</div>';
  }

  function runSearch() {
    var kw  = kwInput.value.trim();
    var tag = tagInput.value.trim();
    lastKeyword = kw;
    lastTag = tag;

    if (!kw && !tag) { showWelcome(); return; }

    var rows = [];
    var hint = '';

    try {
      if (tag) {
        var sql = 'SELECT DISTINCT i.id, i.start_time, i.end_time, i.summary, i.context, i.detail, v.title, v.youtube_id, v.playlist_index FROM ideas i JOIN idea_tags it ON it.idea_id = i.id JOIN tags t ON t.id = it.tag_id JOIN videos v ON v.id = i.video_id WHERE t.name LIKE ?';
        var params = ['%' + tag + '%'];
        if (activeCategory) {
          sql += ' AND t.category = ?';
          params.push(activeCategory);
        }
        sql += ' ORDER BY v.playlist_index, i.start_time LIMIT 200';
        rows = queryRows(sql, params);
        hint = activeCategory ? 'tagged "' + tag + '" \u00b7 category: ' + activeCategory : 'tagged "' + tag + '"';
      } else {
        var p = '%' + kw + '%';
        rows = queryRows(
          'SELECT DISTINCT i.id, i.start_time, i.end_time, i.summary, i.context, i.detail, v.title, v.youtube_id, v.playlist_index FROM ideas i JOIN videos v ON v.id = i.video_id WHERE i.summary LIKE ? OR i.context LIKE ? OR i.detail LIKE ? ORDER BY v.playlist_index, i.start_time LIMIT 200',
          [p, p, p]
        );
        hint = 'keyword "' + kw + '"';
      }
    } catch(err) {
      showError(err.message);
      return;
    }

    if (rows.length === 0) {
      statusBar.style.display = 'none';
      appContent.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-state-title">No results found</div>' +
          '<div class="empty-state-sub">Try a different keyword or tag</div>' +
        '</div>';
      return;
    }

    var ids = rows.map(function(r) { return r.id; });
    var tagMap = fetchTagsForIdeas(ids);

    statusBar.style.display = 'flex';
    var limited = rows.length === 200 ? ' (showing first 200)' : '';
    resultCount.innerHTML = '<span>' + rows.length + '</span> result' + (rows.length === 1 ? '' : 's') + limited;
    statusHint.textContent = hint;

    var html = '';
    for (var i = 0; i < rows.length; i++) {
      html += renderCard(rows[i], tagMap, i);
    }
    appContent.innerHTML = '<div class="results-list">' + html + '</div>';

    appContent.querySelectorAll('.card-detail-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var arrow = btn.querySelector('.toggle-arrow');
        var body  = btn.nextElementSibling;
        var isOpen = body.classList.toggle('open');
        arrow.classList.toggle('open', isOpen);
        btn.querySelector('.toggle-label').textContent = isOpen ? 'Hide detail' : 'Show detail';
      });
    });
  }

  function queryRows(sql, params) {
    var res = db.exec(sql, params);
    if (!res.length) return [];
    var cols = res[0].columns;
    return res[0].values.map(function(row) {
      var obj = {};
      cols.forEach(function(c, i) { obj[c] = row[i]; });
      return obj;
    });
  }

  function fetchTagsForIdeas(ids) {
    if (!ids.length) return {};
    var placeholders = ids.map(function() { return '?'; }).join(',');
    var rows = queryRows(
      'SELECT it.idea_id, t.name, t.category FROM idea_tags it JOIN tags t ON t.id = it.tag_id WHERE it.idea_id IN (' + placeholders + ')',
      ids
    );
    var map = {};
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!map[r.idea_id]) map[r.idea_id] = [];
      map[r.idea_id].push({ name: r.name, category: r.category });
    }
    return map;
  }

  var CAT_ORDER = ['scripture','greek_term','hebrew_term','person','work','topic','concept'];
  var RAIL_COLORS = ['#0f1923','#1a3a5c','#2e4a6a','#1a4a3a','#3a2a1a','#2a1a3a','#1a3a2a'];

  function renderCard(row, tagMap, index) {
    var tags = (tagMap[row.id] || []).slice();
    tags.sort(function(a, b) {
      return CAT_ORDER.indexOf(a.category) - CAT_ORDER.indexOf(b.category);
    });

    var seconds   = timeToSeconds(row.start_time);
    var tsDisplay = formatTimestamp(row.start_time);
    var ytLink    = 'https://www.youtube.com/watch?v=' + encodeURIComponent(row.youtube_id) + '&t=' + seconds + 's';

    var tagsHtml = '';
    for (var i = 0; i < tags.length; i++) {
      tagsHtml += '<span class="tag tag-' + escHtml(tags[i].category) + '" title="' + escHtml(tags[i].category) + '">' + escHtml(tags[i].name) + '</span>';
    }

    var detailHtml = '';
    if (row.detail) {
      detailHtml =
        '<button class="card-detail-toggle">' +
          '<span class="toggle-arrow">&#9658;</span>' +
          '<span class="toggle-label">Show detail</span>' +
        '</button>' +
        '<div class="card-detail-body">' +
          '<div class="card-detail-text">' + escHtml(row.detail) + '</div>' +
        '</div>';
    }

    var railColor = RAIL_COLORS[(row.playlist_index - 1) % RAIL_COLORS.length];

    return (
      '<div class="card" style="animation-delay:' + (index * 0.03) + 's">' +
        '<div class="card-rail" style="background:' + railColor + '"></div>' +
        '<div class="card-body">' +
          '<div class="card-meta">' +
            '<span class="card-video-num">Video ' + row.playlist_index + '</span>' +
            '<span class="card-video-title">' + escHtml(row.title) + '</span>' +
            '<a class="card-timestamp" href="' + ytLink + '" target="_blank" rel="noopener">' + escHtml(tsDisplay) + '</a>' +
          '</div>' +
          '<div class="card-summary">' + escHtml(row.summary) + '</div>' +
          (row.context ? '<div class="card-context">' + escHtml(row.context) + '</div>' : '') +
          (tagsHtml ? '<div class="card-tags">' + tagsHtml + '</div>' : '') +
          detailHtml +
        '</div>' +
      '</div>'
    );
  }

  function timeToSeconds(ts) {
    if (!ts) return 0;
    var parts = ts.split(':').map(Number);
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    return parts[0] || 0;
  }

  function formatTimestamp(ts) {
    if (!ts) return '';
    var parts = ts.split(':');
    if (parts.length === 3 && parts[0] === '00') return parts[1] + ':' + parts[2];
    return ts;
  }

  function escHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  searchBtn.addEventListener('click', runSearch);

  kwInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') runSearch(); });
  tagInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') runSearch(); });

  document.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      if (lastKeyword || lastTag) runSearch();
    });
  });

})();
</script>
</body>
</html>
