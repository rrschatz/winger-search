<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mike Winger — Idea Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #0f1923;
      --navy-mid:   #1a2838;
      --navy-light: #243447;
      --cream:      #f5f0e8;
      --cream-dim:  #e8e2d6;
      --gold:       #c9a84c;
      --gold-light: #e8c96e;
      --white:      #ffffff;
      --radius: 4px;
      --shadow: 0 2px 12px rgba(0,0,0,0.18);
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'IBM Plex Sans', sans-serif; background: var(--cream); color: var(--navy); min-height: 100vh; }

    header { background: var(--navy); color: var(--cream); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 20px rgba(0,0,0,0.4); }

    .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; display: flex; align-items: stretch; }

    .header-brand { padding: 16px 28px 16px 0; border-right: 1px solid var(--navy-light); flex-shrink: 0; min-width: 220px; }
    .brand-series { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 3px; }
    .brand-title { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 700; line-height: 1.1; color: var(--cream); }
    .brand-sub { font-size: 10px; color: #6b7f96; margin-top: 3px; font-family: 'IBM Plex Mono', monospace; }
    .brand-link { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: rgba(201,168,76,0.55); text-decoration: none; margin-top: 4px; letter-spacing: 0.05em; transition: color 0.15s; }
    .brand-link:hover { color: var(--gold); }

    .header-search { flex: 1; padding: 14px 0 14px 28px; display: flex; flex-direction: column; gap: 10px; }
    .search-row { display: flex; gap: 10px; align-items: center; }
    .search-field { position: relative; flex: 1; }
    .search-field label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); position: absolute; top: 8px; left: 12px; pointer-events: none; z-index: 1; }
    .search-field input { width: 100%; background: var(--navy-mid); border: 1px solid var(--navy-light); border-radius: var(--radius); color: var(--cream); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; padding: 26px 12px 8px; outline: none; transition: border-color 0.15s, background 0.15s; }
    .search-field input::placeholder { color: #4a5e72; }
    .search-field input:focus { border-color: var(--gold); background: var(--navy-light); }

    .btn-search { background: var(--gold); color: var(--navy); border: none; border-radius: var(--radius); font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; padding: 0 20px; height: 52px; cursor: pointer; flex-shrink: 0; transition: background 0.15s, transform 0.1s; }
    .btn-search:hover { background: var(--gold-light); }
    .btn-search:active { transform: scale(0.97); }

    .btn-browse { background: transparent; color: #6b7f96; border: 1px solid var(--navy-light); border-radius: var(--radius); font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; padding: 0 16px; height: 52px; cursor: pointer; flex-shrink: 0; transition: color 0.15s, border-color 0.15s, background 0.15s; }
    .btn-browse:hover { color: var(--cream); border-color: #4a5e72; }
    .btn-browse.active { color: var(--gold); border-color: var(--gold); background: rgba(201,168,76,0.08); }

    .filter-bar { background: var(--navy-mid); border-top: 1px solid var(--navy-light); border-bottom: 1px solid rgba(201,168,76,0.15); }
    .filter-bar-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; overflow-x: auto; }
    .filter-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: #4a5e72; white-space: nowrap; padding: 10px 16px 10px 0; flex-shrink: 0; }
    .filter-btn { background: none; border: none; border-bottom: 2px solid transparent; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6b7f96; padding: 10px 14px; cursor: pointer; white-space: nowrap; transition: color 0.15s, border-color 0.15s; flex-shrink: 0; }
    .filter-btn:hover { color: var(--cream); }
    .filter-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }

    .status-bar { display: flex; align-items: baseline; gap: 16px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--cream-dim); }
    .result-count { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; }
    .result-count span { color: var(--gold); }
    .status-hint { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8a9aaa; }

    .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 24px; gap: 20px; }
    .loader-ring { width: 48px; height: 48px; border: 3px solid var(--cream-dim); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #8a9aaa; }

    .error-state { background: #fff0f0; border: 1px solid #fca5a5; border-radius: var(--radius); padding: 20px 24px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #991b1b; }

    .empty-state { text-align: center; padding: 80px 24px; }
    .empty-state-title { font-family: 'Playfair Display', serif; font-size: 28px; color: #c0c8d0; margin-bottom: 10px; }
    .empty-state-sub { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #a0aab4; }

    .welcome-state { text-align: center; padding: 60px 24px; }
    .welcome-title { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 600; color: var(--navy); margin-bottom: 12px; }
    .welcome-desc { font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; color: #5a6a7a; max-width: 600px; margin: 0 auto 36px; line-height: 1.65; }
    .welcome-desc a { color: var(--gold); text-decoration: none; }
    .welcome-desc a:hover { text-decoration: underline; }
    .welcome-stats { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; }
    .welcome-stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .welcome-stat-num { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 700; color: var(--gold); line-height: 1; }
    .welcome-stat-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8a9aaa; }

    /* BROWSE PANEL */
    .browse-panel { display: none; }
    .browse-panel.active { display: block; }

    /* BROWSE VIDEOS */
    .browse-video-list { display: flex; flex-direction: column; gap: 6px; }
    .browse-video-item { background: var(--white); border: 1px solid var(--cream-dim); border-radius: 6px; padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 14px; transition: box-shadow 0.15s, transform 0.1s; }
    .browse-video-item:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.1); transform: translateY(-1px); }
    .browse-video-badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; flex-shrink: 0; white-space: nowrap; }
    .browse-video-badge.wim { background: rgba(201,168,76,0.12); color: var(--gold); border: 1px solid rgba(201,168,76,0.3); }
    .browse-video-badge.livestreams { background: rgba(37,99,235,0.08); color: #2563eb; border: 1px solid rgba(37,99,235,0.25); }
    .browse-video-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--navy); flex: 1; min-width: 0; }
    .browse-video-count { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #8a9aaa; flex-shrink: 0; }
    .browse-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--cream-dim); flex-wrap: wrap; }
    .browse-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; flex: 1; }
    .browse-filter-input { background: var(--white); border: 1px solid var(--cream-dim); border-radius: var(--radius); font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; padding: 8px 12px; outline: none; width: 240px; color: var(--navy); transition: border-color 0.15s; }
    .browse-filter-input:focus { border-color: var(--gold); }

    .browse-cats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .browse-cat-btn { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 12px; border-radius: 20px; border: 1px solid; cursor: pointer; background: transparent; transition: background 0.12s, color 0.12s; }
    .browse-cat-btn.all { color: var(--navy); border-color: #c0c8d0; }
    .browse-cat-btn.all.sel { background: var(--navy); color: var(--cream); border-color: var(--navy); }
    .browse-cat-btn.scripture { color: #2563eb; border-color: rgba(37,99,235,0.4); }
    .browse-cat-btn.scripture.sel { background: #2563eb; color: white; }
    .browse-cat-btn.person { color: #ea580c; border-color: rgba(234,88,12,0.4); }
    .browse-cat-btn.person.sel { background: #ea580c; color: white; }
    .browse-cat-btn.greek_term { color: #7c3aed; border-color: rgba(124,58,237,0.4); }
    .browse-cat-btn.greek_term.sel { background: #7c3aed; color: white; }
    .browse-cat-btn.hebrew_term { color: #0d9488; border-color: rgba(13,148,136,0.4); }
    .browse-cat-btn.hebrew_term.sel { background: #0d9488; color: white; }
    .browse-cat-btn.work { color: #92400e; border-color: rgba(146,64,14,0.4); }
    .browse-cat-btn.work.sel { background: #92400e; color: white; }
    .browse-cat-btn.topic { color: #16a34a; border-color: rgba(22,163,74,0.4); }
    .browse-cat-btn.topic.sel { background: #16a34a; color: white; }
    .browse-cat-btn.concept { color: #64748b; border-color: rgba(100,116,139,0.4); }
    .browse-cat-btn.concept.sel { background: #64748b; color: white; }

    .browse-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .browse-tag-btn { font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 3px; border: 1px solid; cursor: pointer; background: transparent; transition: opacity 0.1s, transform 0.1s; display: flex; align-items: center; gap: 6px; }
    .browse-tag-btn:hover { opacity: 0.75; transform: scale(0.97); }
    .browse-tag-count { font-size: 9px; opacity: 0.6; }
    .browse-tag-btn.scripture { color: #2563eb; border-color: rgba(37,99,235,0.3); background: rgba(37,99,235,0.05); }
    .browse-tag-btn.person { color: #ea580c; border-color: rgba(234,88,12,0.3); background: rgba(234,88,12,0.05); }
    .browse-tag-btn.greek_term { color: #7c3aed; border-color: rgba(124,58,237,0.3); background: rgba(124,58,237,0.05); }
    .browse-tag-btn.hebrew_term { color: #0d9488; border-color: rgba(13,148,136,0.3); background: rgba(13,148,136,0.05); }
    .browse-tag-btn.work { color: #92400e; border-color: rgba(146,64,14,0.3); background: rgba(146,64,14,0.05); }
    .browse-tag-btn.topic { color: #16a34a; border-color: rgba(22,163,74,0.3); background: rgba(22,163,74,0.05); }
    .browse-tag-btn.concept { color: #64748b; border-color: rgba(100,116,139,0.3); background: rgba(100,116,139,0.05); }
    .browse-empty { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #a0aab4; padding: 24px 0; }

    /* CARDS */
    .results-list { display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--white); border: 1px solid var(--cream-dim); border-radius: 6px; box-shadow: var(--shadow); display: grid; grid-template-columns: 4px 1fr; overflow: hidden; transition: box-shadow 0.15s, transform 0.15s; animation: fadeInUp 0.2s ease both; }
    .card:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.12); transform: translateY(-1px); }
    .card-rail { background: var(--navy); }
    .card-body { padding: 16px 20px 14px; }
    .card-meta { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .card-video-num { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8a9aaa; flex-shrink: 0; }
    .card-video-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--navy); flex: 1; min-width: 0; }
    .card-timestamp { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--gold); text-decoration: none; flex-shrink: 0; padding: 2px 8px; border: 1px solid rgba(201,168,76,0.3); border-radius: 3px; transition: background 0.15s, color 0.15s; display: flex; align-items: center; gap: 5px; }
    .card-timestamp::before { content: '\25B6'; font-size: 7px; }
    .card-timestamp:hover { background: var(--gold); color: var(--navy); border-color: var(--gold); }
    .card-summary { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 500; line-height: 1.5; color: var(--navy); margin-bottom: 6px; }
    .card-context { font-family: 'IBM Plex Sans', sans-serif; font-style: italic; font-size: 12px; color: #6a7a8a; margin-bottom: 10px; line-height: 1.4; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 2px 7px; border-radius: 3px; border: 1px solid; cursor: default; transition: opacity 0.1s; }
    .tag:hover { opacity: 0.8; }
    .tag-scripture   { color: #2563eb; border-color: rgba(37,99,235,0.3);   background: rgba(37,99,235,0.07); }
    .tag-greek_term  { color: #7c3aed; border-color: rgba(124,58,237,0.3);  background: rgba(124,58,237,0.07); }
    .tag-hebrew_term { color: #0d9488; border-color: rgba(13,148,136,0.3);  background: rgba(13,148,136,0.07); }
    .tag-person      { color: #ea580c; border-color: rgba(234,88,12,0.3);   background: rgba(234,88,12,0.07); }
    .tag-work        { color: #92400e; border-color: rgba(146,64,14,0.3);   background: rgba(146,64,14,0.07); }
    .tag-topic       { color: #16a34a; border-color: rgba(22,163,74,0.3);   background: rgba(22,163,74,0.07); }
    .tag-concept     { color: #64748b; border-color: rgba(100,116,139,0.3); background: rgba(100,116,139,0.07); }
    .card-detail-toggle { background: none; border: none; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: #8a9aaa; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 5px; transition: color 0.15s; margin-top: 2px; }
    .card-detail-toggle:hover { color: var(--navy); }
    .toggle-arrow { display: inline-block; transition: transform 0.2s; font-size: 8px; }
    .toggle-arrow.open { transform: rotate(90deg); }
    .card-detail-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, margin-top 0.2s; }
    .card-detail-body.open { max-height: 400px; margin-top: 10px; }
    .card-detail-text { font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; line-height: 1.65; color: #3a4a5a; border-left: 2px solid var(--cream-dim); padding-left: 14px; }

    /* SCOPE BAR */
    .scope-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 10px 14px; background: var(--white); border: 1px solid var(--cream-dim); border-radius: 6px; flex-wrap: wrap; }
    .scope-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #8a9aaa; flex-shrink: 0; }
    .scope-pill { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--cream-dim); cursor: pointer; background: transparent; color: #6b7f96; transition: all 0.15s; }
    .scope-pill:hover { border-color: #8a9aaa; color: var(--navy); }
    .scope-pill.active { background: var(--navy); color: var(--cream); border-color: var(--navy); }
    .scope-pill.wim.active { background: var(--gold); color: var(--navy); border-color: var(--gold); }
    .scope-pill.liv.active { background: #2563eb; color: white; border-color: #2563eb; }
    .scope-pill.vid.active { background: #16a34a; color: white; border-color: #16a34a; }
    .scope-clear { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #8a9aaa; cursor: pointer; background: none; border: none; text-decoration: underline; margin-left: 4px; }
    .scope-clear:hover { color: var(--navy); }
    .scope-video-name { font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: var(--navy); font-weight: 500; margin-left: 4px; }

    /* VIDEO TAGS HEADER */
    .video-tags-header { margin-bottom: 16px; padding: 14px 16px; background: var(--white); border: 1px solid var(--cream-dim); border-radius: 6px; }
    .video-tags-header .browse-grid { margin-top: 10px; }
    .video-tags-title { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #8a9aaa; margin-bottom: 8px; }

    .filter-bar-inner::-webkit-scrollbar { height: 3px; }
    .filter-bar-inner::-webkit-scrollbar-track { background: transparent; }
    .filter-bar-inner::-webkit-scrollbar-thumb { background: var(--navy-light); border-radius: 2px; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 640px) {
      .header-inner { flex-direction: column; padding: 16px; gap: 0; }
      .header-brand { padding: 0 0 12px; border-right: none; border-bottom: 1px solid var(--navy-light); min-width: 0; }
      .header-search { padding: 12px 0 0; }
      .search-row { flex-wrap: wrap; }
      .btn-search, .btn-browse { flex: 1; }
      .card-meta { flex-direction: column; gap: 6px; }
      .browse-filter-input { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-brand">
      <div class="brand-series">biblethinker.org</div>
      <div class="brand-title">Mike Winger</div>
      <div class="brand-sub">Idea Index &middot; Livestreams &amp; Series</div>
      <a class="brand-link" href="https://www.biblethinker.org" target="_blank" rel="noopener">biblethinker.org &nearr;</a>
    </div>
    <div class="header-search">
      <div class="search-row">
        <div class="search-field" style="flex:2">
          <label>Keyword Search</label>
          <input type="text" id="kwInput" placeholder="headship, resurrection, Calvinism&hellip;" autocomplete="off" spellcheck="false">
        </div>
        <div class="search-field" style="flex:2">
          <label>Tag / Person / Scripture</label>
          <input type="text" id="tagInput" placeholder="kephale, Peter Singer, Romans 8:28&hellip;" autocomplete="off" spellcheck="false">
        </div>
        <button class="btn-search" id="searchBtn">Search</button>
        <button class="btn-browse" id="browseBtn">Tags</button>
        <button class="btn-browse" id="videosBtn">Videos</button>
        <button class="btn-browse" id="resetBtn" style="color:#e05252;border-color:rgba(224,82,82,0.3)">Reset</button>
      </div>
    </div>
  </div>
</header>

<div class="filter-bar">
  <div class="filter-bar-inner">
    <span class="filter-label">Filter by tag type:</span>
    <button class="filter-btn active" data-cat="">All</button>
    <button class="filter-btn" data-cat="topic">Topic</button>
    <button class="filter-btn" data-cat="scripture">Scripture</button>
    <button class="filter-btn" data-cat="person">Person</button>
    <button class="filter-btn" data-cat="greek_term">Greek Term</button>
    <button class="filter-btn" data-cat="hebrew_term">Hebrew Term</button>
    <button class="filter-btn" data-cat="work">Work</button>
    <button class="filter-btn" data-cat="concept">Concept</button>
  </div>
</div>

<main>
  <div id="scopeBar" class="scope-bar">
    <span class="scope-label">Scope:</span>
    <button class="scope-pill active" data-scope="">All</button>
    <button class="scope-pill wim" data-scope="wim">WiM</button>
    <button class="scope-pill liv" data-scope="livestreams">Livestreams</button>
    <span id="scopeVideoName" class="scope-video-name" style="display:none"></span>
    <button id="scopeClear" class="scope-clear" style="display:none">clear video</button>
  </div>

  <div id="statusBar" class="status-bar" style="display:none">
    <div class="result-count" id="resultCount"></div>
    <div class="status-hint" id="statusHint"></div>
  </div>

  <div id="browsePanel" class="browse-panel">
    <div class="browse-header">
      <div class="browse-title">Index</div>
      <input class="browse-filter-input" id="browseFilterInput" type="text" placeholder="Filter tags&hellip;" autocomplete="off" spellcheck="false">
    </div>
    <div class="browse-cats" id="browseCats"></div>
    <div class="browse-grid" id="browseGrid"></div>
  </div>

  <div id="appContent">
    <div class="loading-state" id="loadingState">
      <div class="loader-ring"></div>
      <div class="loading-label">Loading database&hellip;</div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script>
(async function () {
  var db = null;
  var activeCategory = '';
  var lastKeyword = '';
  var lastTag = '';
  var dbStats = { ideas: 0, videos: 0, tags: 0 };
  var browseMode = false;
  var videoBrowseMode = false;
  var browseCat = 'all';
  var allBrowseTags = [];
  var allVideos = [];
  var activeSeries = '';
  var activeVideoId = null;
  var activeVideoTitle = '';

  var kwInput           = document.getElementById('kwInput');
  var tagInput          = document.getElementById('tagInput');
  var searchBtn         = document.getElementById('searchBtn');
  var browseBtn         = document.getElementById('browseBtn');
  var videosBtn         = document.getElementById('videosBtn');
  var browsePanel       = document.getElementById('browsePanel');
  var appContent        = document.getElementById('appContent');
  var statusBar         = document.getElementById('statusBar');
  var resultCount       = document.getElementById('resultCount');
  var statusHint        = document.getElementById('statusHint');
  var browseCatsEl      = document.getElementById('browseCats');
  var browseGridEl      = document.getElementById('browseGrid');
  var browseFilterInput = document.getElementById('browseFilterInput');
  var scopeVideoName  = document.getElementById('scopeVideoName');
  var scopeClear      = document.getElementById('scopeClear');
  var resetBtn        = document.getElementById('resetBtn');

  try {
    var SQL = await initSqlJs({
      locateFile: function(file) {
        return 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/' + file;
      }
    });
    var resp = await fetch('mike_winger.db');
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ' — could not fetch mike_winger.db');
    var buf = await resp.arrayBuffer();
    db = new SQL.Database(new Uint8Array(buf));

    dbStats.ideas  = queryRows('SELECT COUNT(*) as n FROM ideas', [])[0].n;
    dbStats.videos = queryRows('SELECT COUNT(*) as n FROM videos', [])[0].n;
    dbStats.tags   = queryRows('SELECT COUNT(DISTINCT name) as n FROM tags', [])[0].n;

    allBrowseTags = queryRows(
      'SELECT t.name, t.category, COUNT(it.idea_id) as cnt FROM tags t JOIN idea_tags it ON it.tag_id = t.id GROUP BY t.id ORDER BY cnt DESC, t.name ASC',
      []
    );

    allVideos = queryRows(
      'SELECT v.id, v.title, v.youtube_id, v.playlist, v.playlist_index, COUNT(i.id) as idea_count FROM videos v LEFT JOIN ideas i ON i.video_id = v.id GROUP BY v.id ORDER BY v.playlist, v.playlist_index',
      []
    );

    showWelcome();
  } catch(err) {
    showError(err.message);
    return;
  }

  /* ---- SCOPE ---- */

  function updateScopeUI() {
    document.querySelectorAll('.scope-pill').forEach(function(p) {
      p.classList.toggle('active', p.dataset.scope === activeSeries);
    });
    if (activeVideoId) {
      scopeVideoName.textContent = activeVideoTitle;
      scopeVideoName.style.display = '';
      scopeClear.style.display = '';
    } else {
      scopeVideoName.style.display = 'none';
      scopeClear.style.display = 'none';
    }
  }

  document.querySelectorAll('.scope-pill').forEach(function(pill) {
    pill.addEventListener('click', function() {
      activeSeries = pill.dataset.scope;
      activeVideoId = null;
      activeVideoTitle = '';
      updateScopeUI();
      if (browseMode) { refreshBrowseTags(); buildBrowseCats(); renderBrowseGrid(); }
      else if (videoBrowseMode) { renderVideoList(); }
      else if (lastKeyword || lastTag) { runSearch(); }
    });
  });

  scopeClear.addEventListener('click', function() {
    activeVideoId = null;
    activeVideoTitle = '';
    updateScopeUI();
    if (browseMode) { refreshBrowseTags(); buildBrowseCats(); renderBrowseGrid(); }
    else if (lastKeyword || lastTag) { runSearch(); }
    else { showWelcome(); }
  });

  resetBtn.addEventListener('click', function() {
    kwInput.value = '';
    tagInput.value = '';
    lastKeyword = '';
    lastTag = '';
    activeCategory = '';
    activeSeries = '';
    activeVideoId = null;
    activeVideoTitle = '';
    browseCat = 'all';
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.cat === ''); });
    updateScopeUI();
    exitBrowse();
    showWelcome();
  });

  function scopeVideoTo(videoId, videoTitle, playlist) {
    activeVideoId = videoId;
    activeVideoTitle = videoTitle;
    activeSeries = playlist;
    updateScopeUI();
  }

  function refreshBrowseTags() {
    if (activeVideoId) {
      allBrowseTags = queryRows(
        'SELECT t.name, t.category, COUNT(DISTINCT it.idea_id) as cnt FROM tags t JOIN idea_tags it ON it.tag_id = t.id JOIN ideas i ON i.id = it.idea_id WHERE i.video_id = ? GROUP BY t.id ORDER BY cnt DESC, t.name ASC',
        [activeVideoId]
      );
    } else if (activeSeries) {
      allBrowseTags = queryRows(
        'SELECT t.name, t.category, COUNT(DISTINCT it.idea_id) as cnt FROM tags t JOIN idea_tags it ON it.tag_id = t.id JOIN ideas i ON i.id = it.idea_id JOIN videos v ON v.id = i.video_id WHERE v.playlist = ? GROUP BY t.id ORDER BY cnt DESC, t.name ASC',
        [activeSeries]
      );
    } else {
      allBrowseTags = queryRows(
        'SELECT t.name, t.category, COUNT(it.idea_id) as cnt FROM tags t JOIN idea_tags it ON it.tag_id = t.id GROUP BY t.id ORDER BY cnt DESC, t.name ASC',
        []
      );
    }
  }

  /* ---- BROWSE ---- */

  var CAT_LABELS = { all:'All', scripture:'Scripture', person:'Person', greek_term:'Greek Term', hebrew_term:'Hebrew Term', work:'Work', topic:'Topic', concept:'Concept' };
  var CAT_ORDER_BROWSE = ['all','scripture','person','greek_term','hebrew_term','work','topic','concept'];

  function buildBrowseCats() {
    var counts = { all: allBrowseTags.length };
    allBrowseTags.forEach(function(t) { counts[t.category] = (counts[t.category] || 0) + 1; });
    var html = '';
    CAT_ORDER_BROWSE.forEach(function(cat) {
      var sel = browseCat === cat ? ' sel' : '';
      var n = counts[cat] || 0;
      html += '<button class="browse-cat-btn ' + cat + sel + '" data-bcat="' + cat + '">' + (CAT_LABELS[cat]||cat) + ' <span style="opacity:0.55">(' + n + ')</span></button>';
    });
    browseCatsEl.innerHTML = html;
    browseCatsEl.querySelectorAll('.browse-cat-btn').forEach(function(btn) {
      btn.addEventListener('click', function() { browseCat = btn.dataset.bcat; buildBrowseCats(); renderBrowseGrid(); });
    });
  }

  function renderBrowseGrid() {
    var filterText = browseFilterInput.value.trim().toLowerCase();
    var tags = allBrowseTags.filter(function(t) {
      if (browseCat !== 'all' && t.category !== browseCat) return false;
      if (filterText && t.name.toLowerCase().indexOf(filterText) === -1) return false;
      return true;
    });
    if (!tags.length) { browseGridEl.innerHTML = '<div class="browse-empty">No tags found</div>'; return; }
    var html = '';
    tags.forEach(function(t) {
      html += '<button class="browse-tag-btn ' + escHtml(t.category) + '" data-bname="' + escHtml(t.name) + '" data-bcat="' + escHtml(t.category) + '">' +
        escHtml(t.name) + '<span class="browse-tag-count">' + t.cnt + '</span></button>';
    });
    browseGridEl.innerHTML = html;
    browseGridEl.querySelectorAll('.browse-tag-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        tagInput.value = btn.dataset.bname;
        var cat = btn.dataset.bcat;
        document.querySelectorAll('.filter-btn').forEach(function(fb) { fb.classList.toggle('active', fb.dataset.cat === cat); });
        activeCategory = cat;
        exitBrowse();
        runSearch();
      });
    });
  }

  function enterBrowse() {
    browseMode = true;
    videoBrowseMode = false;
    browseBtn.classList.add('active');
    videosBtn.classList.remove('active');
    browsePanel.classList.add('active');
    statusBar.style.display = 'none';
    appContent.style.display = 'none';
    browseFilterInput.placeholder = 'Filter tags\u2026';
    var titleEl = browsePanel.querySelector('.browse-title');
    if (titleEl) {
      var label = 'Tags';
      if (activeVideoId) label = 'Tags \u00b7 ' + activeVideoTitle;
      else if (activeSeries === 'wim') label = 'Tags \u00b7 Women in Ministry';
      else if (activeSeries === 'livestreams') label = 'Tags \u00b7 Livestreams';
      titleEl.textContent = label;
    }
    refreshBrowseTags();
    buildBrowseCats();
    renderBrowseGrid();
  }

  function exitBrowse() {
    browseMode = false;
    videoBrowseMode = false;
    browseBtn.classList.remove('active');
    videosBtn.classList.remove('active');
    browsePanel.classList.remove('active');
    appContent.style.display = '';
    browseFilterInput.placeholder = 'Filter tags\u2026';
    var titleEl = browsePanel.querySelector('.browse-title');
    if (titleEl) titleEl.textContent = 'Index';
  }

  browseBtn.addEventListener('click', function() {
    if (browseMode) { exitBrowse(); showWelcome(); } else { enterBrowse(); }
  });

  browseFilterInput.addEventListener('input', function() {
    if (videoBrowseMode) renderVideoList();
    else renderBrowseGrid();
  });

  /* ---- SERIES LABEL ---- */

  function seriesLabel(playlist, index) {
    if (playlist === 'wim') return 'WiM ' + index;
    return 'Liv ' + index;
  }

  /* ---- VIDEO BROWSE ---- */

  function enterVideoBrowse() {
    videoBrowseMode = true;
    browseMode = false;
    videosBtn.classList.add('active');
    browseBtn.classList.remove('active');
    browsePanel.classList.add('active');
    statusBar.style.display = 'none';
    appContent.style.display = 'none';
    browseCatsEl.innerHTML = '';
    browseFilterInput.placeholder = 'Filter videos\u2026';
    var titleEl = browsePanel.querySelector('.browse-title');
    if (titleEl) titleEl.textContent = 'Videos';
    renderVideoList();
  }

  function renderVideoList() {
    var filterText = browseFilterInput.value.trim().toLowerCase();
    var vids = allVideos.filter(function(v) {
      if (activeSeries && v.playlist !== activeSeries) return false;
      if (!filterText) return true;
      return v.title.toLowerCase().indexOf(filterText) !== -1 || seriesLabel(v.playlist, v.playlist_index).toLowerCase().indexOf(filterText) !== -1;
    });
    if (!vids.length) { browseGridEl.innerHTML = '<div class="browse-empty">No videos found</div>'; return; }
    var container = document.createElement('div');
    container.className = 'browse-video-list';
    vids.forEach(function(v) {
      var item = document.createElement('div');
      item.className = 'browse-video-item';
      item.dataset.vid = v.id;
      var badge = document.createElement('span');
      badge.className = 'browse-video-badge ' + v.playlist;
      badge.textContent = seriesLabel(v.playlist, v.playlist_index);
      var title = document.createElement('span');
      title.className = 'browse-video-title';
      title.textContent = v.title;
      var count = document.createElement('span');
      count.className = 'browse-video-count';
      count.textContent = v.idea_count + ' ideas';
      item.appendChild(badge);
      item.appendChild(title);
      item.appendChild(count);
      item.addEventListener('click', function() { showVideoIdeas(v.id); });
      container.appendChild(item);
    });
    browseGridEl.innerHTML = '';
    browseGridEl.appendChild(container);
  }

  function showVideoIdeas(videoId, filterTagName) {
    exitBrowse();
    var videoInfo = allVideos.filter(function(v) { return v.id === videoId; })[0];
    if (videoInfo) scopeVideoTo(videoId, videoInfo.title, videoInfo.playlist);

    var sql, params;
    if (filterTagName) {
      sql = 'SELECT DISTINCT i.id, i.start_time, i.end_time, i.summary, i.context, i.detail, v.title, v.youtube_id, v.playlist_index, v.playlist FROM ideas i JOIN videos v ON v.id = i.video_id JOIN idea_tags it ON it.idea_id = i.id JOIN tags t ON t.id = it.tag_id WHERE v.id = ? AND t.name = ? ORDER BY i.start_time';
      params = [videoId, filterTagName];
    } else {
      sql = 'SELECT i.id, i.start_time, i.end_time, i.summary, i.context, i.detail, v.title, v.youtube_id, v.playlist_index, v.playlist FROM ideas i JOIN videos v ON v.id = i.video_id WHERE v.id = ? ORDER BY i.start_time';
      params = [videoId];
    }
    var rows = queryRows(sql, params);

    if (!rows.length) {
      appContent.innerHTML = '';
      var emptyDiv = document.createElement('div');
      emptyDiv.className = 'empty-state';
      var emptyTitle = document.createElement('div');
      emptyTitle.className = 'empty-state-title';
      emptyTitle.textContent = 'No ideas found';
      emptyDiv.appendChild(emptyTitle);
      appContent.appendChild(emptyDiv);
      return;
    }

    var ids = rows.map(function(r) { return r.id; });
    var tagMap = fetchTagsForIdeas(ids);

    statusBar.style.display = 'flex';
    resultCount.innerHTML = '<span>' + rows.length + '</span> idea' + (rows.length === 1 ? '' : 's');
    var hintText = seriesLabel(rows[0].playlist, rows[0].playlist_index) + ' \u00b7 ' + rows[0].title;
    if (filterTagName) hintText += ' \u00b7 tag: ' + filterTagName;
    statusHint.textContent = hintText;

    var videoTags = queryRows(
      'SELECT t.name, t.category, COUNT(DISTINCT it.idea_id) as cnt FROM tags t JOIN idea_tags it ON it.tag_id = t.id JOIN ideas i ON i.id = it.idea_id WHERE i.video_id = ? GROUP BY t.id ORDER BY cnt DESC, t.name ASC',
      [videoId]
    );

    var tagBarHtml = '<div class="video-tags-header"><div class="video-tags-title">Tags in this video' + (filterTagName ? ' <button class="scope-clear" id="clearTagFilter">show all</button>' : '') + '</div><div class="browse-grid">';
    videoTags.forEach(function(t) {
      var isActive = filterTagName === t.name ? ' style="opacity:1;font-weight:600;box-shadow:0 0 0 2px currentColor"' : '';
      tagBarHtml += '<button class="browse-tag-btn ' + escHtml(t.category) + '" data-vtag="' + escHtml(t.name) + '"' + isActive + '>' + escHtml(t.name) + '<span class="browse-tag-count">' + t.cnt + '</span></button>';
    });
    tagBarHtml += '</div></div>';

    var html = tagBarHtml;
    for (var i = 0; i < rows.length; i++) html += renderCard(rows[i], tagMap, i);
    appContent.innerHTML = '<div class="results-list">' + html + '</div>';

    appContent.querySelectorAll('[data-vtag]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var clickedTag = btn.dataset.vtag;
        if (clickedTag === filterTagName) showVideoIdeas(videoId);
        else showVideoIdeas(videoId, clickedTag);
      });
    });

    var clearBtn = document.getElementById('clearTagFilter');
    if (clearBtn) clearBtn.addEventListener('click', function() { showVideoIdeas(videoId); });

    appContent.querySelectorAll('.card-detail-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var arrow = btn.querySelector('.toggle-arrow');
        var body  = btn.nextElementSibling;
        var isOpen = body.classList.toggle('open');
        arrow.classList.toggle('open', isOpen);
        btn.querySelector('.toggle-label').textContent = isOpen ? 'Hide detail' : 'Show detail';
      });
    });
  }

  videosBtn.addEventListener('click', function() {
    if (videoBrowseMode) { exitBrowse(); showWelcome(); } else { enterVideoBrowse(); }
  });

  /* ---- VERSE RANGE MATCHING ---- */

  function parseVerseRef(str) {
    var m = str.trim().match(/^(.+?)\s+(\d+):(\d+)(?:-(\d+))?$/);
    if (!m) return null;
    return { book: m[1].trim().toLowerCase(), chapter: parseInt(m[2]), startVerse: parseInt(m[3]), endVerse: m[4] ? parseInt(m[4]) : parseInt(m[3]) };
  }

  function scriptureTagMatchesVerse(tagName, searchRef) {
    var tagRef = parseVerseRef(tagName);
    if (!tagRef) return false;
    var sb = searchRef.book, tb = tagRef.book;
    if (sb !== tb && !tb.startsWith(sb) && !sb.startsWith(tb)) return false;
    if (searchRef.chapter !== tagRef.chapter) return false;
    return searchRef.startVerse <= tagRef.endVerse && searchRef.endVerse >= tagRef.startVerse;
  }

  function verseRangeIdeaIds(searchStr) {
    var searchRef = parseVerseRef(searchStr);
    if (!searchRef) return [];
    var scriptureTags = queryRows('SELECT id, name FROM tags WHERE category = ?', ['scripture']);
    var matchingTagIds = [];
    for (var i = 0; i < scriptureTags.length; i++) {
      if (scriptureTagMatchesVerse(scriptureTags[i].name, searchRef)) matchingTagIds.push(scriptureTags[i].id);
    }
    if (!matchingTagIds.length) return [];
    var ph = matchingTagIds.map(function() { return '?'; }).join(',');
    return queryRows('SELECT DISTINCT idea_id FROM idea_tags WHERE tag_id IN (' + ph + ')', matchingTagIds).map(function(r) { return r.idea_id; });
  }

  /* ---- SEARCH ---- */

  function showWelcome() {
    statusBar.style.display = 'none';
    appContent.innerHTML =
      '<div class="welcome-state">' +
        '<div class="welcome-title">Mike Winger &mdash; Idea Index</div>' +
        '<div class="welcome-desc">Every significant idea, argument, and reference across Mike\'s livestreams and the complete <em>Women in Ministry</em> series &mdash; keyword searchable and tagged by scripture, person, Greek term, and more. Content from <a href="https://www.biblethinker.org" target="_blank" rel="noopener">biblethinker.org</a>.</div>' +
        '<div class="welcome-stats">' +
          '<div class="welcome-stat"><div class="welcome-stat-num">' + dbStats.videos + '</div><div class="welcome-stat-label">Videos</div></div>' +
          '<div class="welcome-stat"><div class="welcome-stat-num">' + Number(dbStats.ideas).toLocaleString() + '</div><div class="welcome-stat-label">Ideas indexed</div></div>' +
          '<div class="welcome-stat"><div class="welcome-stat-num">' + Number(dbStats.tags).toLocaleString() + '</div><div class="welcome-stat-label">Unique tags</div></div>' +
        '</div>' +
      '</div>';
  }

  function showError(msg) {
    statusBar.style.display = 'none';
    appContent.innerHTML = '<div class="error-state">Error: ' + escHtml(msg) + '</div>';
  }

  function scopeWhere() {
    var clauses = [];
    var params = [];
    if (activeVideoId) { clauses.push('v.id = ?'); params.push(activeVideoId); }
    else if (activeSeries) { clauses.push('v.playlist = ?'); params.push(activeSeries); }
    return { clauses: clauses, params: params };
  }

  function runSearch() {
    exitBrowse();
    var kw  = kwInput.value.trim();
    var tag = tagInput.value.trim();
    lastKeyword = kw;
    lastTag = tag;
    if (!kw && !tag) { showWelcome(); return; }

    var scope = scopeWhere();
    var rows = [];
    var hint = '';

    try {
      if (tag) {
        var sql = 'SELECT DISTINCT i.id, i.start_time, i.end_time, i.summary, i.context, i.detail, v.title, v.youtube_id, v.playlist_index, v.playlist FROM ideas i JOIN idea_tags it ON it.idea_id = i.id JOIN tags t ON t.id = it.tag_id JOIN videos v ON v.id = i.video_id WHERE t.name LIKE ?';
        var params = ['%' + tag + '%'];
        if (activeCategory) { sql += ' AND t.category = ?'; params.push(activeCategory); }
        scope.clauses.forEach(function(c) { sql += ' AND ' + c; });
        params = params.concat(scope.params);
        sql += ' ORDER BY v.playlist_index, i.start_time LIMIT 200';
        rows = queryRows(sql, params);

        var rangeIds = verseRangeIdeaIds(tag);
        if (rangeIds.length) {
          var existing = {};
          rows.forEach(function(r) { existing[r.id] = true; });
          var newIds = rangeIds.filter(function(id) { return !existing[id]; });
          if (newIds.length) {
            var ph = newIds.map(function() { return '?'; }).join(',');
            var extraSql = 'SELECT DISTINCT i.id, i.start_time, i.end_time, i.summary, i.context, i.detail, v.title, v.youtube_id, v.playlist_index, v.playlist FROM ideas i JOIN videos v ON v.id = i.video_id WHERE i.id IN (' + ph + ')';
            var extraParams = newIds.slice();
            scope.clauses.forEach(function(c) { extraSql += ' AND ' + c; });
            extraParams = extraParams.concat(scope.params);
            extraSql += ' ORDER BY v.playlist_index, i.start_time';
            var extra = queryRows(extraSql, extraParams);
            rows = rows.concat(extra).sort(function(a, b) {
              if (a.playlist_index !== b.playlist_index) return a.playlist_index - b.playlist_index;
              return (a.start_time || '').localeCompare(b.start_time || '');
            }).slice(0, 200);
          }
        }
        hint = (activeCategory ? activeCategory + ' \u00b7 ' : '') + 'tagged "' + tag + '"';

      } else {
        var p = '%' + kw + '%';
        if (activeCategory) {
          var sql2 = 'SELECT DISTINCT i.id, i.start_time, i.end_time, i.summary, i.context, i.detail, v.title, v.youtube_id, v.playlist_index, v.playlist FROM ideas i JOIN videos v ON v.id = i.video_id JOIN idea_tags it ON it.idea_id = i.id JOIN tags t ON t.id = it.tag_id WHERE (i.summary LIKE ? OR i.context LIKE ? OR i.detail LIKE ?) AND t.category = ?';
          var params2 = [p, p, p, activeCategory];
          scope.clauses.forEach(function(c) { sql2 += ' AND ' + c; });
          params2 = params2.concat(scope.params);
          sql2 += ' ORDER BY v.playlist_index, i.start_time LIMIT 200';
          rows = queryRows(sql2, params2);
          hint = activeCategory + ' \u00b7 keyword "' + kw + '"';
        } else {
          var sql3 = 'SELECT DISTINCT i.id, i.start_time, i.end_time, i.summary, i.context, i.detail, v.title, v.youtube_id, v.playlist_index, v.playlist FROM ideas i JOIN videos v ON v.id = i.video_id WHERE (i.summary LIKE ? OR i.context LIKE ? OR i.detail LIKE ?)';
          var params3 = [p, p, p];
          scope.clauses.forEach(function(c) { sql3 += ' AND ' + c; });
          params3 = params3.concat(scope.params);
          sql3 += ' ORDER BY v.playlist_index, i.start_time LIMIT 200';
          rows = queryRows(sql3, params3);
          hint = 'keyword "' + kw + '"';
        }
      }
    } catch(err) { showError(err.message); return; }

    if (activeSeries === 'wim') hint += ' \u00b7 WiM';
    else if (activeSeries === 'livestreams') hint += ' \u00b7 Livestreams';
    if (activeVideoId) hint += ' \u00b7 ' + activeVideoTitle;

    if (rows.length === 0) {
      statusBar.style.display = 'none';
      appContent.innerHTML = '<div class="empty-state"><div class="empty-state-title">No results found</div><div class="empty-state-sub">Try a different keyword or adjust the scope</div></div>';
      return;
    }

    var ids = rows.map(function(r) { return r.id; });
    var tagMap = fetchTagsForIdeas(ids);

    statusBar.style.display = 'flex';
    var limited = rows.length === 200 ? ' (showing first 200)' : '';
    resultCount.innerHTML = '<span>' + rows.length + '</span> result' + (rows.length === 1 ? '' : 's') + limited;
    statusHint.textContent = hint;

    var html = '';
    for (var i = 0; i < rows.length; i++) html += renderCard(rows[i], tagMap, i);
    appContent.innerHTML = '<div class="results-list">' + html + '</div>';

    appContent.querySelectorAll('.card-detail-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var arrow = btn.querySelector('.toggle-arrow');
        var body  = btn.nextElementSibling;
        var isOpen = body.classList.toggle('open');
        arrow.classList.toggle('open', isOpen);
        btn.querySelector('.toggle-label').textContent = isOpen ? 'Hide detail' : 'Show detail';
      });
    });
  }

  function queryRows(sql, params) {
    var res = db.exec(sql, params);
    if (!res.length) return [];
    var cols = res[0].columns;
    return res[0].values.map(function(row) {
      var obj = {}; cols.forEach(function(c, i) { obj[c] = row[i]; }); return obj;
    });
  }

  function fetchTagsForIdeas(ids) {
    if (!ids.length) return {};
    var ph = ids.map(function() { return '?'; }).join(',');
    var rows = queryRows('SELECT it.idea_id, t.name, t.category FROM idea_tags it JOIN tags t ON t.id = it.tag_id WHERE it.idea_id IN (' + ph + ')', ids);
    var map = {};
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!map[r.idea_id]) map[r.idea_id] = [];
      map[r.idea_id].push({ name: r.name, category: r.category });
    }
    return map;
  }

  var CAT_ORDER = ['scripture','greek_term','hebrew_term','person','work','topic','concept'];
  var RAIL_COLORS = ['#0f1923','#1a3a5c','#2e4a6a','#1a4a3a','#3a2a1a','#2a1a3a','#1a3a2a'];

  function renderCard(row, tagMap, index) {
    var tags = (tagMap[row.id] || []).slice();
    tags.sort(function(a, b) { return CAT_ORDER.indexOf(a.category) - CAT_ORDER.indexOf(b.category); });
    var seconds   = timeToSeconds(row.start_time);
    var tsDisplay = formatTimestamp(row.start_time);
    var ytLink    = 'https://www.youtube.com/watch?v=' + encodeURIComponent(row.youtube_id) + '&t=' + seconds + 's';
    var tagsHtml  = tags.map(function(t) { return '<span class="tag tag-' + escHtml(t.category) + '" title="' + escHtml(t.category) + '">' + escHtml(t.name) + '</span>'; }).join('');
    var detailHtml = row.detail ?
      '<button class="card-detail-toggle"><span class="toggle-arrow">&#9658;</span><span class="toggle-label">Show detail</span></button>' +
      '<div class="card-detail-body"><div class="card-detail-text">' + escHtml(row.detail) + '</div></div>' : '';
    var railColor = RAIL_COLORS[(row.playlist_index - 1) % RAIL_COLORS.length];
    return (
      '<div class="card" style="animation-delay:' + (index * 0.03) + 's">' +
        '<div class="card-rail" style="background:' + railColor + '"></div>' +
        '<div class="card-body">' +
          '<div class="card-meta">' +
            '<span class="card-video-num">' + seriesLabel(row.playlist || 'livestreams', row.playlist_index) + '</span>' +
            '<span class="card-video-title">' + escHtml(row.title) + '</span>' +
            '<a class="card-timestamp" href="' + ytLink + '" target="_blank" rel="noopener">' + escHtml(tsDisplay) + '</a>' +
          '</div>' +
          '<div class="card-summary">' + escHtml(row.summary) + '</div>' +
          (row.context ? '<div class="card-context">' + escHtml(row.context) + '</div>' : '') +
          (tagsHtml ? '<div class="card-tags">' + tagsHtml + '</div>' : '') +
          detailHtml +
        '</div>' +
      '</div>'
    );
  }

  function timeToSeconds(ts) {
    if (!ts) return 0;
    var parts = ts.split(':').map(Number);
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    return parts[0] || 0;
  }

  function formatTimestamp(ts) {
    if (!ts) return '';
    var parts = ts.split(':');
    if (parts.length === 3 && parts[0] === '00') return parts[1] + ':' + parts[2];
    return ts;
  }

  function escHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  searchBtn.addEventListener('click', runSearch);
  kwInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') runSearch(); });
  tagInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') runSearch(); });
  document.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      if (lastKeyword || lastTag) runSearch();
    });
  });

})();
</script>
</body>
</html>
